services:
  mongo:
    image: mongo:6.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-secret}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-eindopdracht}
    volumes:
      - mongo-dev-data:/data/db
    networks:
      - devops-net

  messagebus:
    image: rabbitmq:3-management
    hostname: "messagebus"
    ports:
      - "15672:15672"
      - "5672:5672"
    networks:
      - devops-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: 80
      MONGO_URL: ${MONGO_URL:-mongodb://root:secret@mongo:27017/eindopdracht?authSource=admin}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@messagebus:5672}
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:80"
    depends_on:
      - mongo
      - messagebus
    networks:
      - devops-net
    
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      - API_URL=${FRONTEND_API_URL:-http://localhost:3000}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4200:4200"
    depends_on:
      - api
    networks:
      - devops-net
    command: ["npm", "run", "start", "--", "--host", "0.0.0.0", "--poll=2000"]

networks:
  devops-net:
    driver: bridge
volumes:
  mongo-dev-data: