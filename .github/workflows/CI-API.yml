name: CI-FullStack

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test-api:
    name: Backend Tests (Jest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: eindopdracht/package-lock.json

      - name: Install API dependencies
        working-directory: ./eindopdracht
        run: npm ci

      - name: Run Jest Coverage (PR only)
        if: github.event_name == 'pull_request'
        uses: ArtiomTr/jest-coverage-report-action@v2
        with:
          working-directory: eindopdracht
          package-manager: npm
          # --roots . voorkomt dat Jest de frontend map scant
          test-script: npm test -- --roots .
          threshold: 80

      - name: Run Tests (Main/Dev)
        if: github.event_name != 'pull_request'
        working-directory: ./eindopdracht
        run: npm test -- --coverage --ci --watchAll=false --roots .

  test-frontend:
    name: Frontend Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: eindopdracht/frontend/package-lock.json

      - name: Install Frontend dependencies
        working-directory: ./eindopdracht/frontend
        run: npm ci

      - name: Run Vitest
        working-directory: ./eindopdracht/frontend
        # De '--run' vlag zorgt dat Vitest stopt na de tests (geen watch mode)
        run: npm test -- --run