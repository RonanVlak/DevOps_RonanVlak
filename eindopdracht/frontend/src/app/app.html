<div class="container">
  <div class="card">
    <h1>{{ title() }}</h1>
    
    <div class="input-section">
      <input 
        [(ngModel)]="newUserName" 
        placeholder="Naam invoeren..."
        (keyup.enter)="addUser()"
      >
      <button (click)="addUser()">Toevoegen</button>
    </div>

    <hr>

    <div class="user-list">
      <h3>Gebruikers in Database A:</h3>
      <ul>
        @for (user of users(); track user._id) {
          <li>👤 {{ user.naam }}</li>
        } @empty {
          <p>Geen gebruikers gevonden.</p>
        }
      </ul>
    </div>
  </div>
</div>
