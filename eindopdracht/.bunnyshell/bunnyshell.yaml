kind: Environment
name: preview
type: primary
urlHandle: preview-ronandevops
components:
    -
        kind: Application
        name: api
        gitRepo: 'https://github.com/RonanVlak/DevOps_RonanVlak.git'
        gitBranch: main
        gitApplicationPath: eindopdracht
        dockerCompose:
            build:
                context: ./eindopdracht
                dockerfile: Dockerfile
            environment:
                MONGO_URL: 'ENCRYPTED[hET7N+ycpqswSuQgKxwwVHAgmaWU4v9v9QewgDdwREzeKAt73/qMoUoPOn20avVzbvtBrRqYgqfPrpWcahMJTXxI4fTPtM6sUuz2QEyd8nvMwjwvY+4Q4pWRM2ZocmNz]'
                PORT: '80'
                RABBITMQ_URL: 'amqp://guest:guest@messagebus:5672'
            ports:
                - '80:80'
            restart: always
            deploy:
                resources:
                    limits:
                        cpus: '0.2'
                        memory: 256MiB
        hosts:
            -
                hostname: 'api-{{ env.base_domain }}'
                path: /
                servicePort: 80
    -
        kind: Application
        name: frontend
        gitRepo: 'https://github.com/RonanVlak/DevOps_RonanVlak.git'
        gitBranch: main
        gitApplicationPath: eindopdracht/frontend
        dockerCompose:
            build:
                context: ./eindopdracht/frontend
                dockerfile: Dockerfile.prod
            environment:
                API_URL: /api
            ports:
                - '80:80'
            deploy:
                resources:
                    limits:
                        cpus: '0.2'
                        memory: 256MiB
        hosts:
            -
                hostname: 'frontend-{{ env.base_domain }}'
                path: /
                servicePort: 80
    -
        kind: Service
        name: messagebus
        dockerCompose:
            hostname: messagebus
            image: 'rabbitmq:3-management'
            labels:
                NAME: messagebus
            ports:
                - '4369:4369'
                - '5671:5671'
                - '5672:5672'
                - '25672:25672'
                - '15671:15671'
                - '15672:15672'
            deploy:
                resources:
                    limits:
                        cpus: '0.2'
                        memory: 256MiB
        hosts:
            -
                hostname: 'messagebus-{{ env.base_domain }}'
                path: /
                servicePort: 15672
    -
        kind: Database
        name: mongo
        dockerCompose:
            environment:
                MONGO_INITDB_DATABASE: 'ENCRYPTED[q+5bTkU1CEnmivzu8iFJR8M9uGwlqEbGO+geAxntlQrilZEzZmhyY3M=]'
                MONGO_INITDB_ROOT_PASSWORD: 'ENCRYPTED[VicBgngt8OAoKPhGVSwibVeMX2utpWUJlYu+sJ9BATMADjtnWuKVkTNmaHJjcw==]'
                MONGO_INITDB_ROOT_USERNAME: 'ENCRYPTED[0jRXX5v0oO03umcOkPzq3hivxCnHZ29GqR3tuz/6rRIv4pWRM2ZocmNz]'
            image: 'mongo:6.0'
            restart: always
            deploy:
                resources:
                    limits:
                        cpus: '0.2'
                        memory: 256MiB
