services:
  mongo:
    image: mongo:6.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-secret}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-eindopdracht}
    volumes:
      - mongo-db-data:/data/db
    deploy:
      replicas: 1
    networks:
      - devops-net

  messagebus:
    image: rabbitmq:3-management
    hostname: "messagebus"
    ports:
      - "15672:15672"
    deploy:
      replicas: 1
    networks:
      - devops-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: mijn-api:latest
    environment:
      PORT: 80
      MONGO_URL: ${MONGO_URL:-mongodb://root:secret@mongo:27017/eindopdracht?authSource=admin}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@messagebus:5672}
    ports:
      - "3000:80"
    deploy:
      replicas: 2  #Start met 2 instanties
      restart_policy:
        condition: on-failure
    networks:
      - devops-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    image: mijn-frontend:latest
    environment:
      - API_URL=http://localhost:3000/api
    ports:
      - "8080:80"
    deploy:
      replicas: 1
    networks:
      - devops-net

  db-exporter:
    image: percona/mongodb_exporter:0.40 
    ports:
      - "9216:9216"
    environment:
      MONGODB_URI: ${MONGO_URL:-mongodb://root:secret@mongo:27017/admin?authSource=admin}
    command:
      - "--collect-all"
      - "--compatible-mode"
    networks:
      - devops-net
    depends_on:
      - mongo

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    deploy:
      replicas: 1
    depends_on:
      - api
      - db-exporter
    networks:
      - devops-net

  grafana:
    build:
      context: ./grafana
      dockerfile: Dockerfile
    image: localhost:5000/eindopdracht-grafana:latest
    ports:
      - "80:3000" 
    deploy:
      replicas: 1
    depends_on:
      - prometheus
    networks:
      - devops-net

networks:
  devops-net:
    driver: overlay # Overlay gebruiken voor swarm communicatie

volumes:
  mongo-db-data: