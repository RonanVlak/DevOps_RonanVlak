services:
  mongo:
    image: mongo:6.0
    restart: always
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    volumes:
      - ./data/db:/data/db
    networks:
      - devops-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    environment:
      PORT: ${PORT}
      MONGO_URL: ${MONGO_URL}
    ports:
      - "3000:${PORT}"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - mongo
    networks:
      - devops-net

networks:
  devops-net:
    driver: bridge