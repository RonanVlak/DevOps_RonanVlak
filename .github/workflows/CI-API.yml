name: CI Pipeline

on:
  push:
    branches: [development]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # 1. Linting
  lint-code:
    name: Code Guidelines Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install root dependencies
        run: npm install

      - name: Run ESLint
        run: npx eslint "eindopdracht/**/*.js"

  # 2. API Tests
  test-api:
    name: API Tests (Jest)
    needs: lint-code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: eindopdracht/package-lock.json

      - name: Install API dependencies
        working-directory: ./eindopdracht
        run: npm ci

      - name: Run Jest Coverage (PR only)
        if: github.event_name == 'pull_request'
        uses: ArtiomTr/jest-coverage-report-action@v2
        with:
          working-directory: eindopdracht
          package-manager: npm
          test-script: npm test -- --roots .
          threshold: 80

      - name: Run Tests (Main/Dev)
        if: github.event_name != 'pull_request'
        working-directory: ./eindopdracht
        run: npm test -- --coverage --ci --watchAll=false --roots .

  # 3. Worker Tests
  test-worker:
    name: Worker Tests (Jest)
    needs: lint-code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Worker dependencies
        working-directory: ./eindopdracht/worker
        run: npm ci 

      - name: Run Worker Tests
        working-directory: ./eindopdracht/worker
        run: npm run test

  # 4. Frontend Tests
  test-frontend:
    name: Frontend Tests (Vitest)
    needs: lint-code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: eindopdracht/frontend/package-lock.json

      - name: Install Frontend dependencies
        working-directory: ./eindopdracht/frontend
        run: npm ci

      - name: Run Vitest
        working-directory: ./eindopdracht/frontend
        run: npx vitest run --run # --run zorgt dat hij niet blijft hangen in watch mode