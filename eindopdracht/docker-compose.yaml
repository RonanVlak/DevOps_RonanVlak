services:
  mongo:
    image: mongo:6.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-secret}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-eindopdracht}
    volumes:
      - mongo-db-data:/data/db
    deploy:
      replicas: 1
    networks:
      - devops-net

  messagebus:
    image: rabbitmq:3-management
    hostname: "messagebus"
    ports:
      - "15672:15672"
    deploy:
      replicas: 1
    networks:
      - devops-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: localhost:5000/mijn-api:latest
    environment:
      PORT: 80
      MONGO_URL: ${MONGO_URL:-mongodb://root:secret@mongo:27017/eindopdracht?authSource=admin}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@messagebus:5672}
    ports:
      - "3000:80"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    networks:
      - devops-net

  mongo-worker:
    image: mongo:6.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-secret}
      MONGO_INITDB_DATABASE: workerdb
    volumes:
      - mongo-worker-data:/data/db
    networks:
      - devops-net
    deploy:
      replicas: 1


  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    image: mijn-worker:latest
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@messagebus:5672}
      MONGO_WORKER_URL: mongodb://${MONGO_USERNAME:-root}:${MONGO_PASSWORD:-secret}@mongo-worker:27017/workerdb?authSource=admin
    networks:
      - devops-net
    depends_on:
      - messagebus
      - mongo-worker
    deploy:
      replicas: 1

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    image: localhost:5000/mijn-frontend:latest
    environment:
      - API_URL=http://localhost:3000/api
    ports:
      - "8080:80"
    deploy:
      replicas: 1
    networks:
      - devops-net

  db-exporter:
    image: percona/mongodb_exporter:0.40 
    ports:
      - "9216:9216"
    environment:
      MONGODB_URI: ${MONGO_URL:-mongodb://root:secret@mongo:27017/admin?authSource=admin}
    command:
      - "--collect-all"
      - "--compatible-mode"
    networks:
      - devops-net
    depends_on:
      - mongo


  alertmanager:
    image: prom/alertmanager:latest
    ports:
      - "9093:9093"
    env_file:
      - .env
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml
    entrypoint:
      - /bin/sh
      - -c
      - |
        # Kopieer naar tmp om de Docker volume beveiliging te omzeilen
        cp /etc/alertmanager/alertmanager.yml /tmp/alertmanager.yml
        sed -i "s|SENDER_EMAIL|$${GMAIL_EMAIL}|g" /tmp/alertmanager.yml
        sed -i "s|SENDER_PASSWORD|$${GMAIL_APP_PASSWORD}|g" /tmp/alertmanager.yml
        /bin/alertmanager --config.file=/tmp/alertmanager.yml
    networks:
      - devops-net
    deploy:
      replicas: 1

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./alert.rules:/etc/prometheus/alert.rules
    ports:
      - "9090:9090"
    deploy:
      replicas: 1
    depends_on:
      - api
      - db-exporter
    networks:
      - devops-net

  grafana:
    build:
      context: ./grafana
      dockerfile: Dockerfile
    image: localhost:5000/eindopdracht-grafana:latest
    ports:
      - "80:3000" 
    deploy:
      replicas: 1
    depends_on:
      - prometheus
    networks:
      - devops-net

networks:
  devops-net:
    driver: overlay # Overlay gebruiken voor swarm communicatie

volumes:
  mongo-db-data:
  mongo-worker-data: